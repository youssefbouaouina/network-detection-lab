name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  lab:
    name: Suricata and Zeek on the generated captures
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Install Suricata and Zeek
        run: |
          sudo apt-get update
          sudo apt-get install -y suricata
          curl -fsSL https://download.opensuse.org/repositories/security:zeek/xUbuntu_24.04/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/zeek.gpg > /dev/null
          echo 'deb http://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/zeek.list
          sudo apt-get update
          sudo apt-get install -y zeek
          echo "/opt/zeek/bin" >> "$GITHUB_PATH"

      - name: Generate the captures
        run: python generate_pcaps.py

      - name: Validate the Suricata ruleset
        run: suricata -T -S rules/lab.rules -c /etc/suricata/suricata.yaml

      - name: Run the lab
        run: bash scripts/run_lab.sh

      - name: Upload measured results and the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-lab-results
          path: |
            results/
            pcaps/
