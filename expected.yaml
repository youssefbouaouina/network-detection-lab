# Ground truth for the network-detection-lab evaluation.
#
# Written BEFORE the first Suricata run. Each scenario is a separate PCAP
# generated by generate_pcaps.py inside the lab. A scenario counts as detected
# when Suricata emits at least one alert whose signature name is in
# `expected_alerts` while reading that PCAP.
version: 1
frozen_on: "2026-11-05"
tools:
  suricata: "7.0.x from Ubuntu 24.04"
  zeek: "from the security:zeek Ubuntu 24.04 repository"
  scapy: "2.6.1"

scenarios:
  - id: S01_tcp_syn_scan
    pcap: pcaps/S01_tcp_syn_scan.pcap
    title: 30 TCP SYN probes from one source in a few seconds
    expected_alerts:
      - LAB TCP SYN scan

  - id: S02_http_path_traversal
    pcap: pcaps/S02_http_path_traversal.pcap
    title: HTTP GET with ../ in the URI
    expected_alerts:
      - LAB HTTP path traversal

  - id: S03_http_sqli
    pcap: pcaps/S03_http_sqli.pcap
    title: HTTP GET with a boolean SQL injection in the query string
    expected_alerts:
      - LAB HTTP SQL injection

  - id: S04_sqlmap_user_agent
    pcap: pcaps/S04_sqlmap_user_agent.pcap
    title: HTTP request with a sqlmap User-Agent
    expected_alerts:
      - LAB sqlmap user agent

  - id: S05_dns_exfil_query
    pcap: pcaps/S05_dns_exfil_query.pcap
    title: DNS query for a long encoded label under exfil.lab
    expected_alerts:
      - LAB DNS exfiltration query

  - id: S06_ssh_bruteforce
    pcap: pcaps/S06_ssh_bruteforce.pcap
    title: 10 TCP connections to port 22 from one source in a few seconds
    expected_alerts:
      - LAB SSH brute force

benign:
  pcap: pcaps/S99_benign.pcap
  title: normal HTTP, DNS and a single SSH connection
  expected_alerts: []
